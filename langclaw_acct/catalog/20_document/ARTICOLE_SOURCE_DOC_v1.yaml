# ARTICOLE_SOURCE_DOC_v1.yaml
# Lane B draft.
# Pack.fiscal_class + primary_kind + emit flags come from this catalog.
# ArticoleFlux binds AFTER emit, on MatchContext built from this row + CO.DiT.
# Jev may propose source_doc_id; the tree aisle is source of truth.

file_schema: "1"
catalog: ArticoleSourceDoc
status: draft
valid_from: "2026-01-01"

enums:
  source_doc_id: slug
  fiscal_class:
    [ro_efactura, foreign_invoice, bon, extras, instructions, recon, workings, unknown]
  our_role: [inbound, outbound, n/a, either]
  primary_kind:
    [ubl_spv, pdf, xml, jpeg, png, xlsx, csv, mt940, sta, eml, unknown]
  extract_backend: [none, ubl, mt940, document_ai, docling]
  posting_eligible: bool

row_schema:
  source_doc_id: slug
  schema_version: "1"
  status: draft|active|deprecated|yanked
  fiscal_class: enum
  aisle: tree prefix
  our_role_default: enum
  posting_eligible: bool
  emit_on_incomplete: bool
  primary:
    required_kinds: [primary_kind]
    companions_are: additional|split
    missing_aisle: path|null          # e.g. _incomplete_spv
  pairing:
    with: [source_doc_id]
    key: [number, date, cui]
  extract:
    backend: extract_backend
    skip_if: [has_text_layer, is_ubl]
  identity:
    needs_tenant_on_doc: bool         # extras
    needs_counterparty_cui: bool      # ro_efactura
    bon_cui_fork: bool
  flux_candidates: [ArticoleFlux.articol_id]
  note: str

# ---------------------------------------------------------------------------
rows:

  - source_doc_id: ro_efactura_ubl
    schema_version: "1"
    status: draft
    fiscal_class: ro_efactura
    aisle: "10_ro_efactura/{inbound|outbound}/{cui}/"
    our_role_default: either
    posting_eligible: true
    emit_on_incomplete: false
    primary:
      required_kinds: [ubl_spv]
      companions_are: additional
      missing_aisle: "10_ro_efactura/_incomplete_spv/"
    pairing:
      with: [ro_efactura_pdf]
      key: [number, date, cui]
    extract:
      backend: ubl
      skip_if: []
    identity:
      needs_tenant_on_doc: false
      needs_counterparty_cui: true
      bon_cui_fork: false
    flux_candidates: [ro_efactura_inbound, ro_efactura_outbound, storno_intrare, storno_iesire]
    note: "Legal primary is CIUS-RO. PDF never primary."

  - source_doc_id: ro_efactura_pdf
    schema_version: "1"
    status: draft
    fiscal_class: ro_efactura
