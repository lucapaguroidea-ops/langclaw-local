# ARTICOL_BON_v1.yaml
# Lane B draft. Lookup AFTER ArticoleFlux bon_cu_cui | bon_fara_cui
# and AFTER Test A (A_band) + nature_bind.
# Job freezes bon.articol_id + bon.articol_version.
# matches(ctx): filters exact + extra_filters exact
#   + require ⊆ ctx.axes + forbid ∩ ctx.axes = ∅
# Empty cell → interrupt articol_bon. Never default tva_deducere=full.

file_schema: "1"
catalog: ArticolBon
status: draft
valid_from: "2026-01-01"
pins_ref: pins_ro_2026
test_A:
  source: pins.bon_simplificat_eur   # "100"
  fx: pins.fx_policy                 # BNR_exigibilitate
  bands: [le_100, bt_100_400, gt_400, n/a]
  note: "A_band computed in graph, not in this file. bt_100_400 → HITL unless MF order on file."

enums:
  nature_code:
    - combustibil
    - protocol
    - cazare
    - transport
    - materiale
    - reparatie
    - parcare
    - peco_shop
    - restaurant
    - it_consumabile
    - altele
  A_band: [le_100, bt_100_400, gt_400, n/a]
  fiscal_cheltuiala: [full, none, partial_50, hitl]
  tva_deducere: [full, none, partial_50, blocked_no_cui, hitl]

row_schema:
  articol_id: slug
  schema_version: "1"
  status: draft|active|deprecated|yanked
  valid_from: date
  valid_to: date|null
  filters: "{nature_code?, A_band?}"
  extra_filters: {our_cui_on_doc: bool}
  require: {axis: [values]}
  forbid: {axis: [values]}
  test_A_required: bool
  fiscal_cheltuiala: enum
  tva_deducere: enum
  cont_cheltuiala: str|null
  tva_cont: str|null
  write_module: WriteModule.module_id
  law_pin: str|null
  hitl_note: str|null

# ---------------------------------------------------------------------------
