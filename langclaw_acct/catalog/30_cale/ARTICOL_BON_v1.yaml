    test_A_required: false
    fiscal_cheltuiala: hitl
    tva_deducere: blocked_no_cui
    cont_cheltuiala: null
    tva_cont: null
    write_module: bon_via_nota
    law_pin: "NM 69(6) / art. 299 — fără CUI beneficiar nu e factură simplificată"
