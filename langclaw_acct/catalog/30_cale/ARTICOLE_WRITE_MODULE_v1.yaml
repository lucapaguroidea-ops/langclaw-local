# ARTICOLE_WRITE_MODULE_v1.yaml
# Lane B draft. Flux names module_id; this catalog is the SAGA mouth.
# No FDB INSERT. saga_path ∈ {import_xml, import_dbf, ui_agent}.
# Approve only after green import on COPY firm.
# Bidirectional check: every Flux.write_modules id must appear in that
# module's used_by_flux, and every used_by_flux id must list the module.
# Flux.write_modules is the walk. used_by_flux is the index. Loader rejects drift.

file_schema: "1"
catalog: ArticoleWriteModule
status: draft
valid_from: "2026-01-01"

enums:
  saga_path: [import_xml, import_dbf, ui_agent]
  validare: [n_a, human, agent]
  backup: [none, before_batch, before_each]
  hitl: [never, first_n, always]

row_schema:
  module_id: slug
  schema_version: "1"
  saga_path: enum
  validare: enum
  backup: enum
  hitl: enum
  first_n: int|null
  max_docs_per_run: int
  fixture: path|null
  used_by_flux: [articol_id]

modules:

  - module_id: parteneri_xml
    schema_version: "1"
    status: draft
    saga_path: import_xml
    validare: n_a
    backup: before_batch
    hitl: first_n
    first_n: 5
    max_docs_per_run: 50
    fixture: fixtures/saga/parteneri.xml
    used_by_flux: [ro_efactura_inbound, ro_efactura_outbound, foreign_invoice_inbound, foreign_invoice_outbound, foreign_rc_neplatitor]

  - module_id: articole_xml
